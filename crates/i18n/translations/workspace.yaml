"Rewinding does not affect files edited manually or via shell commands.":
  es: "Retroceder no afecta a los archivos editados manualmente o mediante comandos del shell."
  pt: "Voltar não afeta arquivos editados manualmente ou por comandos do shell."
  fr: "Le retour en arrière n'affecte pas les fichiers modifiés manuellement ou via des commandes shell."
  de: "Das Zurückspulen wirkt sich nicht auf Dateien aus, die manuell oder über Shell-Befehle bearbeitet wurden."
  it: "Il ritorno indietro non influisce sui file modificati manualmente o tramite comandi della shell."
  uk: "Повернення не впливає на файли, змінені вручну або командами оболонки."
  ja: "巻き戻しは、手動またはシェルコマンドで編集したファイルには影響しません。"
  zh-Hans: "回退不会影响手动或通过 Shell 命令编辑的文件。"
"Are you sure you want to rewind? This will restore your code and conversation to before this point, and cancel any commands the agent is currently running. A copy of the original conversation will be saved in your conversation history.":
  es: "¿Seguro que quieres retroceder? Se restaurarán el código y la conversación al estado anterior a este punto y se cancelarán los comandos que el agente esté ejecutando. Se guardará una copia de la conversación original en tu historial."
  pt: "Tem certeza de que deseja voltar? Isso restaurará seu código e a conversa para antes deste ponto e cancelará os comandos que o agente estiver executando. Uma cópia da conversa original será salva no seu histórico de conversas."
  fr: "Voulez-vous vraiment revenir en arrière ? Votre code et la conversation seront restaurés à leur état antérieur à ce point, et les commandes en cours d'exécution par l'agent seront annulées. Une copie de la conversation d'origine sera enregistrée dans votre historique."
  de: "Möchten Sie wirklich zurückspulen? Dadurch werden Ihr Code und die Unterhaltung auf den Stand vor diesem Punkt zurückgesetzt und alle Befehle abgebrochen, die der Agent gerade ausführt. Eine Kopie der ursprünglichen Unterhaltung wird in Ihrem Verlauf gespeichert."
  it: "Vuoi davvero tornare indietro? Il codice e la conversazione verranno ripristinati a prima di questo punto e verranno annullati i comandi che l'agente sta eseguendo. Una copia della conversazione originale verrà salvata nella cronologia."
  uk: "Справді повернутися? Код і розмову буде відновлено до стану перед цим моментом, а команди, які зараз виконує агент, буде скасовано. Копію початкової розмови буде збережено в історії розмов."
  ja: "巻き戻してもよろしいですか？コードと会話がこの時点より前の状態に復元され、エージェントが現在実行中のコマンドはキャンセルされます。元の会話のコピーは会話履歴に保存されます。"
  zh-Hans: "确定要回退吗？这会将你的代码和对话恢复到此处之前的状态，并取消代理当前正在运行的所有命令。原始对话的副本将保存在对话历史中。"
