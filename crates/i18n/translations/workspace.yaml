"Set up a reusable starting point for your tabs. Pick a repo, choose a session type, and optionally attach a worktree. Use it whenever you want to open a tab with this setup.":
  es: "Configura un punto de partida reutilizable para tus pestañas. Elige un repositorio, un tipo de sesión y, si quieres, adjunta un worktree. Úsalo siempre que quieras abrir una pestaña con esta configuración."
  pt: "Configure um ponto de partida reutilizável para suas abas. Escolha um repositório, um tipo de sessão e, se quiser, anexe um worktree. Use-o sempre que quiser abrir uma aba com essa configuração."
  fr: "Définissez un point de départ réutilisable pour vos onglets. Choisissez un dépôt, un type de session et, si vous le souhaitez, associez un worktree. Utilisez-le chaque fois que vous voulez ouvrir un onglet avec cette configuration."
  de: "Richten Sie einen wiederverwendbaren Ausgangspunkt für Ihre Tabs ein. Wählen Sie ein Repository und einen Sitzungstyp und hängen Sie optional einen Worktree an. Verwenden Sie ihn, wann immer Sie einen Tab mit dieser Einrichtung öffnen möchten."
  it: "Configura un punto di partenza riutilizzabile per le schede. Scegli un repository, un tipo di sessione e, facoltativamente, collega un worktree. Usalo ogni volta che vuoi aprire una scheda con questa configurazione."
  uk: "Налаштуйте повторно використовувану відправну точку для вкладок. Виберіть репозиторій, тип сеансу та за потреби додайте worktree. Використовуйте її щоразу, коли хочете відкрити вкладку з цим налаштуванням."
  ja: "タブ用の再利用可能な開始点を設定します。リポジトリとセッションの種類を選び、必要に応じて worktree を関連付けます。この設定でタブを開きたいときにいつでも使用できます。"
  zh-Hans: "为标签页设置可复用的起点。选择仓库和会话类型，并可选择附加工作树。每当你想以此设置打开标签页时即可使用。"
"Introducing universal agent support: level up any coding agent with Termloc":
  es: "Presentamos la compatibilidad universal con agentes: mejora cualquier agente de programación con Termloc"
  pt: "Apresentamos o suporte universal a agentes: turbine qualquer agente de programação com o Termloc"
  fr: "Voici la prise en charge universelle des agents : améliorez n'importe quel agent de code avec Termloc"
  de: "Neu: universelle Agentenunterstützung – bringen Sie jeden Coding-Agenten mit Termloc auf das nächste Level"
  it: "Ecco il supporto universale per gli agenti: potenzia qualsiasi agente di programmazione con Termloc"
  uk: "Представляємо універсальну підтримку агентів: покращте будь-якого агента програмування з Termloc"
  ja: "ユニバーサルエージェントサポートの登場：Termloc であらゆるコーディングエージェントをレベルアップ"
  zh-Hans: "全新通用代理支持：借助 Termloc 提升任何编程代理"
