"Termloc pipes through notifications from any CLI coding agent into a unified notification center that works across all coding agents and harnesses.":
  es: "Termloc reúne las notificaciones de cualquier agente de programación de CLI en un centro de notificaciones unificado que funciona con todos los agentes y entornos."
  pt: "O Termloc reúne as notificações de qualquer agente de programação de CLI em uma central de notificações unificada que funciona com todos os agentes e ambientes."
  fr: "Termloc regroupe les notifications de tous les agents de code en CLI dans un centre de notifications unifié qui fonctionne avec tous les agents et environnements."
  de: "Termloc leitet Benachrichtigungen aller CLI-Coding-Agenten in eine einheitliche Benachrichtigungszentrale, die mit allen Coding-Agenten und Umgebungen funktioniert."
  it: "Termloc riunisce le notifiche di qualsiasi agente di programmazione CLI in un centro notifiche unificato che funziona con tutti gli agenti e gli ambienti."
  uk: "Termloc збирає сповіщення від будь-якого CLI-агента програмування в єдиний центр сповіщень, що працює з усіма агентами та середовищами."
  ja: "Termloc は、あらゆる CLI コーディングエージェントの通知を、すべてのエージェントとハーネスで使える統合通知センターに集約します。"
  zh-Hans: "Termloc 会将任何 CLI 编程代理的通知汇集到统一的通知中心，适用于所有编程代理和框架。"
