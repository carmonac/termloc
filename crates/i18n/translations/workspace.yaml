"Vertical tabs show all open agent and terminal panes, grouped by tab. Customize what information you want to see to support your workflow.":
  es: "Las pestañas verticales muestran todos los paneles de agentes y terminales abiertos, agrupados por pestaña. Personaliza la información que quieres ver según tu flujo de trabajo."
  pt: "As abas verticais mostram todos os painéis de agentes e terminais abertos, agrupados por aba. Personalize as informações que deseja ver de acordo com seu fluxo de trabalho."
  fr: "Les onglets verticaux affichent tous les volets d'agent et de terminal ouverts, regroupés par onglet. Personnalisez les informations affichées selon votre façon de travailler."
  de: "Vertikale Tabs zeigen alle geöffneten Agent- und Terminalbereiche gruppiert nach Tab an. Passen Sie an, welche Informationen Sie für Ihren Workflow sehen möchten."
  it: "Le schede verticali mostrano tutti i riquadri di agenti e terminali aperti, raggruppati per scheda. Personalizza le informazioni da visualizzare in base al tuo flusso di lavoro."
  uk: "Вертикальні вкладки показують усі відкриті панелі агентів і терміналів, згруповані за вкладками. Налаштуйте, яку інформацію бачити, відповідно до вашого робочого процесу."
  ja: "縦タブには、開いているすべてのエージェントとターミナルのペインがタブごとにグループ化されて表示されます。ワークフローに合わせて表示する情報をカスタマイズできます。"
  zh-Hans: "垂直标签页按标签页分组显示所有打开的代理和终端窗格。你可以根据工作流自定义要显示的信息。"
