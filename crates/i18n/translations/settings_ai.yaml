"What happens when you submit a new prompt while the agent is still responding. You can override this per conversation using the auto-queue toggle.":
  es: "Qué ocurre cuando envías un nuevo prompt mientras el agente todavía está respondiendo. Puedes cambiarlo en cada conversación con el interruptor de cola automática."
  pt: "O que acontece quando você envia um novo prompt enquanto o agente ainda está respondendo. Você pode substituir isso por conversa com a opção de fila automática."
  fr: "Ce qui se passe lorsque vous envoyez un nouveau prompt alors que l'agent répond encore. Vous pouvez modifier ce comportement pour chaque conversation avec l'option de file d'attente automatique."
  de: "Was passiert, wenn Sie einen neuen Prompt senden, während der Agent noch antwortet. Sie können dies pro Unterhaltung mit dem Schalter für die automatische Warteschlange überschreiben."
  it: "Cosa succede quando invii un nuovo prompt mentre l'agente sta ancora rispondendo. Puoi modificarlo per ogni conversazione con l'interruttore della coda automatica."
  uk: "Що відбувається, коли ви надсилаєте новий запит, поки агент ще відповідає. Це можна змінити для окремої розмови перемикачем автоматичної черги."
  ja: "エージェントの応答中に新しいプロンプトを送信したときの動作です。会話ごとに自動キューの切り替えで変更できます。"
  zh-Hans: "在代理仍在回复时提交新提示的处理方式。你可以使用自动排队开关按对话覆盖此设置。"

"Default long-running command submission mode":
