"What happens when you submit a prompt while an agent is driving an agent-requested long-running command. Queued prompts are sent to the agent when the command finishes.":
  es: "Qué ocurre cuando envías un prompt mientras un agente controla un comando de larga duración que él mismo solicitó. Los prompts en cola se envían al agente cuando termina el comando."
  pt: "O que acontece quando você envia um prompt enquanto um agente controla um comando de longa duração solicitado por ele. Os prompts na fila são enviados ao agente quando o comando termina."
  fr: "Ce qui se passe lorsque vous envoyez un prompt alors qu'un agent pilote une commande de longue durée qu'il a demandée. Les prompts en file d'attente sont envoyés à l'agent à la fin de la commande."
  de: "Was passiert, wenn Sie einen Prompt senden, während ein Agent einen von ihm angeforderten lang laufenden Befehl steuert. Prompts in der Warteschlange werden an den Agenten gesendet, sobald der Befehl beendet ist."
  it: "Cosa succede quando invii un prompt mentre un agente gestisce un comando di lunga durata da lui richiesto. I prompt in coda vengono inviati all'agente al termine del comando."
  uk: "Що відбувається, коли ви надсилаєте запит, поки агент керує тривалою командою, яку сам запросив. Запити з черги надсилаються агенту після завершення команди."
  ja: "エージェントが自ら要求した長時間実行コマンドを操作している間にプロンプトを送信したときの動作です。キューに入ったプロンプトは、コマンドの終了時にエージェントへ送信されます。"
  zh-Hans: "在代理操作其请求的长时间运行命令时提交提示的处理方式。排队的提示将在命令结束后发送给代理。"

