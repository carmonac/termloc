"Profiles let you define how your Agent operates — from the actions it can take and when it needs approval, to the models it uses for tasks like coding and planning. You can also scope them to individual projects.":
  es: "Los perfiles te permiten definir cómo funciona tu agente: desde las acciones que puede realizar y cuándo necesita aprobación, hasta los modelos que usa para tareas como programar y planificar. También puedes limitarlos a proyectos concretos."
  pt: "Os perfis permitem definir como seu agente opera — desde as ações que ele pode realizar e quando precisa de aprovação até os modelos que usa para tarefas como programação e planejamento. Você também pode restringi-los a projetos específicos."
  fr: "Les profils vous permettent de définir le fonctionnement de votre agent : des actions qu'il peut effectuer et du moment où il doit demander une approbation aux modèles qu'il utilise pour des tâches comme le code et la planification. Vous pouvez aussi les limiter à des projets précis."
  de: "Mit Profilen legen Sie fest, wie Ihr Agent arbeitet – von den Aktionen, die er ausführen darf, und wann er eine Genehmigung braucht, bis zu den Modellen, die er für Aufgaben wie Programmieren und Planen nutzt. Sie können Profile auch auf einzelne Projekte beschränken."
  it: "I profili ti consentono di definire come funziona il tuo agente: dalle azioni che può eseguire e quando serve un'approvazione, fino ai modelli che usa per attività come programmazione e pianificazione. Puoi anche limitarli a singoli progetti."
  uk: "Профілі дають змогу визначити, як працює ваш агент: від дій, які він може виконувати, і моментів, коли потрібне схвалення, до моделей, які він використовує для програмування та планування. Профілі також можна обмежити окремими проєктами."
  ja: "プロファイルでは、エージェントが実行できる操作や承認が必要なタイミングから、コーディングや計画などのタスクに使うモデルまで、エージェントの動作を定義できます。個別のプロジェクトに限定することもできます。"
  zh-Hans: "配置文件可让你定义代理的运行方式——从它可以执行的操作、何时需要批准，到它用于编码和规划等任务的模型。你还可以将其限定于单个项目。"

