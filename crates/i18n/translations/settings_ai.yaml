"Let AI suggest the next command to run based on your command history, outputs, and common workflows.":
  es: "Permite que la IA sugiera el siguiente comando según tu historial de comandos, sus salidas y los flujos de trabajo habituales."
  pt: "Permita que a IA sugira o próximo comando com base no seu histórico de comandos, nas saídas e nos fluxos de trabalho comuns."
  fr: "Laissez l'IA suggérer la prochaine commande à exécuter en fonction de votre historique de commandes, des sorties et des workflows courants."
  de: "Lassen Sie die KI anhand Ihres Befehlsverlaufs, der Ausgaben und gängiger Workflows den nächsten Befehl vorschlagen."
  it: "Consenti all'IA di suggerire il prossimo comando da eseguire in base alla cronologia dei comandi, agli output e ai flussi di lavoro comuni."
  uk: "Дозволити ШІ пропонувати наступну команду на основі історії команд, їхнього виводу та типових робочих процесів."
  ja: "コマンド履歴、出力、一般的なワークフローに基づいて、次に実行するコマンドを AI が提案します。"
  zh-Hans: "让 AI 根据你的命令历史、输出和常用工作流建议下一条要运行的命令。"

"Let AI suggest natural language prompts, as inline banners in the input, based on recent commands and their outputs.":
  es: "Permite que la IA sugiera prompts en lenguaje natural, como banners en la entrada, según los comandos recientes y sus salidas."
  pt: "Permita que a IA sugira prompts em linguagem natural, como banners na entrada, com base nos comandos recentes e em suas saídas."
  fr: "Laissez l'IA suggérer des prompts en langage naturel, sous forme de bannières dans la saisie, en fonction des commandes récentes et de leurs sorties."
  de: "Lassen Sie die KI anhand der letzten Befehle und ihrer Ausgaben Prompts in natürlicher Sprache als Banner in der Eingabe vorschlagen."
  it: "Consenti all'IA di suggerire prompt in linguaggio naturale, come banner nell'input, in base ai comandi recenti e ai loro output."
  uk: "Дозволити ШІ пропонувати запити природною мовою як банери в полі введення на основі нещодавніх команд та їхнього виводу."
  ja: "最近のコマンドとその出力に基づいて、自然言語のプロンプトを入力欄のバナーとして AI が提案します。"
  zh-Hans: "让 AI 根据最近的命令及其输出，在输入框中以横幅形式建议自然语言提示。"

"Let AI suggest code diffs and queries as inline banners in the blocklist, based on recent commands and their outputs.":
  es: "Permite que la IA sugiera diffs de código y consultas como banners en la lista de bloques, según los comandos recientes y sus salidas."
  pt: "Permita que a IA sugira diffs de código e consultas como banners na lista de blocos, com base nos comandos recentes e em suas saídas."
  fr: "Laissez l'IA suggérer des diffs de code et des requêtes sous forme de bannières dans la liste des blocs, en fonction des commandes récentes et de leurs sorties."
  de: "Lassen Sie die KI anhand der letzten Befehle und ihrer Ausgaben Code-Diffs und Abfragen als Banner in der Blockliste vorschlagen."
  it: "Consenti all'IA di suggerire diff di codice e query come banner nell'elenco dei blocchi, in base ai comandi recenti e ai loro output."
  uk: "Дозволити ШІ пропонувати зміни коду та запити як банери у списку блоків на основі нещодавніх команд та їхнього виводу."
  ja: "最近のコマンドとその出力に基づいて、コードの差分やクエリをブロックリストのバナーとして AI が提案します。"
  zh-Hans: "让 AI 根据最近的命令及其输出，在块列表中以横幅形式建议代码差异和查询。"

"Let AI suggest natural language autosuggestions, based on recent commands and their outputs.":
  es: "Permite que la IA ofrezca autosugerencias en lenguaje natural según los comandos recientes y sus salidas."
  pt: "Permita que a IA ofereça sugestões automáticas em linguagem natural com base nos comandos recentes e em suas saídas."
  fr: "Laissez l'IA proposer des suggestions automatiques en langage naturel en fonction des commandes récentes et de leurs sorties."
  de: "Lassen Sie die KI anhand der letzten Befehle und ihrer Ausgaben automatische Vorschläge in natürlicher Sprache machen."
  it: "Consenti all'IA di proporre suggerimenti automatici in linguaggio naturale in base ai comandi recenti e ai loro output."
  uk: "Дозволити ШІ пропонувати автопідказки природною мовою на основі нещодавніх команд та їхнього виводу."
  ja: "最近のコマンドとその出力に基づいて、自然言語の自動候補を AI が提案します。"
  zh-Hans: "让 AI 根据最近的命令及其输出提供自然语言自动建议。"

"Let AI generate a title for your shared block based on the command and output.":
  es: "Permite que la IA genere un título para tu bloque compartido según el comando y su salida."
  pt: "Permita que a IA gere um título para o seu bloco compartilhado com base no comando e na saída."
  fr: "Laissez l'IA générer un titre pour votre bloc partagé à partir de la commande et de sa sortie."
  de: "Lassen Sie die KI anhand des Befehls und der Ausgabe einen Titel für Ihren geteilten Block erstellen."
  it: "Consenti all'IA di generare un titolo per il blocco condiviso in base al comando e all'output."
  uk: "Дозволити ШІ створювати назву для спільного блока на основі команди та її виводу."
  ja: "コマンドと出力に基づいて、共有ブロックのタイトルを AI が生成します。"
  zh-Hans: "让 AI 根据命令和输出为你共享的块生成标题。"

"Let AI generate commit messages and pull request titles and descriptions.":
  es: "Permite que la IA genere mensajes de commit y títulos y descripciones de pull requests."
  pt: "Permita que a IA gere mensagens de commit e títulos e descrições de pull requests."
  fr: "Laissez l'IA générer les messages de commit ainsi que les titres et descriptions des pull requests."
  de: "Lassen Sie die KI Commit-Nachrichten sowie Titel und Beschreibungen von Pull Requests erstellen."
  it: "Consenti all'IA di generare messaggi di commit e titoli e descrizioni delle pull request."
  uk: "Дозволити ШІ створювати повідомлення комітів, а також назви й описи pull request."
  ja: "コミットメッセージと、プルリクエストのタイトルおよび説明を AI が生成します。"
  zh-Hans: "让 AI 生成提交信息以及拉取请求的标题和描述。"

