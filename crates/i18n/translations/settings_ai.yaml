"Auto-spawn servers from third-party agents":
  es: "Iniciar automáticamente servidores de agentes de terceros"
  pt: "Iniciar automaticamente servidores de agentes de terceiros"
  fr: "Lancer automatiquement les serveurs des agents tiers"
