"Enabling natural language detection will detect when natural language is written in the terminal input, and then automatically switch to Agent Mode for AI queries.":
  es: "Al activar la detección de lenguaje natural, se detectará cuando escribas en lenguaje natural en la entrada del terminal y se cambiará automáticamente al modo agente para las consultas de IA."
  pt: "Ao ativar a detecção de linguagem natural, será detectado quando você escrever em linguagem natural na entrada do terminal, alternando automaticamente para o modo agente nas consultas de IA."
  fr: "La détection du langage naturel repère le texte en langage naturel saisi dans le terminal et bascule automatiquement en mode agent pour les requêtes d'IA."
  de: "Die Erkennung natürlicher Sprache erkennt, wenn in der Terminaleingabe natürliche Sprache geschrieben wird, und wechselt für KI-Anfragen automatisch in den Agent-Modus."
