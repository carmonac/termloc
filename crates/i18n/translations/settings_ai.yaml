"You haven't added any MCP servers yet. Once you do, you'll be able to control how much autonomy the Local Agent has when interacting with them. ":
  es: "Aún no has añadido ningún servidor MCP. Cuando lo hagas, podrás controlar cuánta autonomía tiene el agente local al interactuar con ellos. "
  pt: "Você ainda não adicionou nenhum servidor MCP. Quando adicionar, poderá controlar quanta autonomia o agente local tem ao interagir com eles. "
  fr: "Vous n'avez encore ajouté aucun serveur MCP. Ensuite, vous pourrez définir le degré d'autonomie de l'agent local lorsqu'il interagit avec eux. "
  de: "Sie haben noch keine MCP-Server hinzugefügt. Danach können Sie festlegen, wie viel Autonomie der lokale Agent im Umgang mit ihnen hat. "
  it: "Non hai ancora aggiunto server MCP. Dopo averlo fatto, potrai controllare quanta autonomia ha l'agente locale quando interagisce con essi. "
  uk: "Ви ще не додали жодного сервера MCP. Після цього ви зможете керувати тим, наскільки автономно локальний агент взаємодіє з ними. "
  ja: "MCP サーバーがまだ追加されていません。追加すると、ローカルエージェントがサーバーとやり取りする際の自律性を設定できます。"
  zh-Hans: "你尚未添加任何 MCP 服务器。添加后，你可以控制本地代理与它们交互时的自主程度。"

