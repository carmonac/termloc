"The Local Agent will always ask for permission before calling any MCP servers on this list.":
  es: "El agente local siempre pedirá permiso antes de llamar a cualquier servidor MCP de esta lista."
  pt: "O agente local sempre pedirá permissão antes de chamar qualquer servidor MCP desta lista."
  fr: "L'agent local demandera toujours l'autorisation avant d'appeler un serveur MCP de cette liste."
  de: "Der lokale Agent fragt immer um Erlaubnis, bevor er einen MCP-Server auf dieser Liste aufruft."
  it: "L'agente locale chiederà sempre l'autorizzazione prima di chiamare un server MCP di questo elenco."
  uk: "Локальний агент завжди запитуватиме дозвіл, перш ніж викликати будь-який сервер MCP з цього списку."
  ja: "ローカルエージェントは、このリストにある MCP サーバーを呼び出す前に必ず許可を求めます。"
  zh-Hans: "本地代理在调用此列表中的任何 MCP 服务器前都会请求许可。"

"The Agent chooses the safest path: acting on its own when confident, and asking for approval when uncertain.":
  es: "El agente elige la opción más segura: actúa por su cuenta cuando está seguro y pide aprobación cuando tiene dudas."
  pt: "O agente escolhe o caminho mais seguro: age por conta própria quando tem confiança e pede aprovação quando está em dúvida."
  fr: "L'agent choisit la voie la plus sûre : il agit seul lorsqu'il est sûr de lui et demande une approbation en cas de doute."
  de: "Der Agent wählt den sichersten Weg: Er handelt selbstständig, wenn er sicher ist, und bittet bei Unsicherheit um Zustimmung."
  it: "L'agente sceglie la strada più sicura: agisce da solo quando è sicuro e chiede l'approvazione in caso di dubbio."
  uk: "Агент обирає найбезпечніший шлях: діє самостійно, коли впевнений, і запитує схвалення, коли сумнівається."
  ja: "エージェントが最も安全な方法を選びます。確信があるときは自ら実行し、不確かなときは承認を求めます。"
  zh-Hans: "代理会选择最安全的方式：有把握时自行操作，不确定时请求批准。"

"Give the Agent full autonomy  — no manual approval ever required.":
  es: "Da al agente total autonomía: nunca se requiere aprobación manual."
  pt: "Dê ao agente autonomia total — nenhuma aprovação manual é necessária."
  fr: "Donnez une autonomie totale à l'agent : aucune approbation manuelle n'est jamais requise."
  de: "Geben Sie dem Agenten volle Autonomie – keine manuelle Genehmigung erforderlich."
  it: "Concedi all'agente piena autonomia: non serve mai l'approvazione manuale."
  uk: "Надати агенту повну автономію — ручне схвалення ніколи не потрібне."
  ja: "エージェントに完全な自律性を与えます。手動での承認は一切不要です。"
  zh-Hans: "赋予代理完全自主权——无需任何手动批准。"

"Require explicit approval before the Agent takes any action.":
  es: "Requiere aprobación explícita antes de que el agente realice cualquier acción."
  pt: "Exige aprovação explícita antes de o agente realizar qualquer ação."
  fr: "Exige une approbation explicite avant toute action de l'agent."
  de: "Vor jeder Aktion des Agenten ist eine ausdrückliche Genehmigung erforderlich."
  it: "Richiede l'approvazione esplicita prima che l'agente esegua qualsiasi azione."
  uk: "Вимагати явного схвалення перед будь-якою дією агента."
  ja: "エージェントが操作を行う前に、明示的な承認を必須にします。"
  zh-Hans: "代理执行任何操作前都需要明确批准。"

"The agent will ask for permission the first time it needs to interact with a running command. After that, it will continue automatically for the rest of that command.":
  es: "El agente pedirá permiso la primera vez que necesite interactuar con un comando en ejecución. Después, continuará automáticamente durante el resto de ese comando."
  pt: "O agente pedirá permissão na primeira vez que precisar interagir com um comando em execução. Depois disso, continuará automaticamente pelo restante desse comando."
  fr: "L'agent demandera l'autorisation la première fois qu'il doit interagir avec une commande en cours. Ensuite, il continuera automatiquement jusqu'à la fin de cette commande."
  de: "Der Agent fragt beim ersten Mal um Erlaubnis, wenn er mit einem laufenden Befehl interagieren muss. Danach fährt er für den Rest dieses Befehls automatisch fort."
  it: "L'agente chiederà l'autorizzazione la prima volta che deve interagire con un comando in esecuzione. Dopodiché proseguirà automaticamente per il resto di quel comando."
  uk: "Агент запитає дозвіл, коли вперше потрібно буде взаємодіяти з запущеною командою. Далі він продовжуватиме автоматично до кінця цієї команди."
  ja: "エージェントは、実行中のコマンドを初めて操作するときに許可を求めます。その後は、そのコマンドが終わるまで自動的に続行します。"
  zh-Hans: "代理首次需要与正在运行的命令交互时会请求许可。之后，在该命令的剩余过程中会自动继续。"

