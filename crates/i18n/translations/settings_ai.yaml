"This model serves as the primary engine behind the Local Agent. It powers most interactions and invokes other models for tasks like planning or code generation when necessary. Termloc may automatically switch to alternate models based on model availability or for auxiliary tasks such as conversation summarization.":
  es: "Este modelo es el motor principal del agente local. Se encarga de la mayoría de las interacciones e invoca otros modelos para tareas como la planificación o la generación de código cuando es necesario. Termloc puede cambiar automáticamente a otros modelos según su disponibilidad o para tareas auxiliares como resumir conversaciones."
  pt: "Este modelo é o mecanismo principal do agente local. Ele responde pela maioria das interações e aciona outros modelos para tarefas como planejamento ou geração de código quando necessário. O Termloc pode mudar automaticamente para outros modelos conforme a disponibilidade ou para tarefas auxiliares, como resumir conversas."
  fr: "Ce modèle est le moteur principal de l'agent local. Il gère la plupart des interactions et fait appel à d'autres modèles pour des tâches comme la planification ou la génération de code si nécessaire. Termloc peut basculer automatiquement vers d'autres modèles selon leur disponibilité ou pour des tâches annexes comme le résumé des conversations."
  de: "Dieses Modell ist die Hauptengine des lokalen Agenten. Es übernimmt die meisten Interaktionen und ruft bei Bedarf andere Modelle für Aufgaben wie Planung oder Codegenerierung auf. Termloc kann je nach Verfügbarkeit oder für Hilfsaufgaben wie das Zusammenfassen von Unterhaltungen automatisch zu anderen Modellen wechseln."
  it: "Questo modello è il motore principale dell'agente locale. Gestisce la maggior parte delle interazioni e richiama altri modelli per attività come la pianificazione o la generazione di codice, se necessario. Termloc può passare automaticamente ad altri modelli in base alla disponibilità o per attività ausiliarie come il riepilogo delle conversazioni."
  uk: "Ця модель — основний рушій локального агента. Вона обробляє більшість взаємодій і за потреби викликає інші моделі для планування чи генерування коду. Termloc може автоматично перемикатися на інші моделі залежно від їхньої доступності або для допоміжних завдань, як-от підсумовування розмов."
  ja: "このモデルはローカルエージェントの中心となるエンジンです。ほとんどの操作を担い、必要に応じて計画やコード生成などのタスクに他のモデルを呼び出します。Termloc は、モデルの利用状況に応じて、または会話の要約などの補助的なタスクのために、自動的に別のモデルへ切り替えることがあります。"
  zh-Hans: "此模型是本地代理的主要引擎。它负责大多数交互，并在必要时调用其他模型来完成规划或代码生成等任务。Termloc 可能会根据模型可用性或为了对话摘要等辅助任务自动切换到其他模型。"

