"When set to true, Termloc will automatically index code repositories as you navigate them - helping agents quickly understand context and provide targeted solutions.":
  es: "Si está activado, Termloc indexará automáticamente los repositorios de código mientras los recorres, para que los agentes entiendan rápidamente el contexto y propongan soluciones específicas."
  pt: "Quando ativado, o Termloc indexará automaticamente os repositórios de código enquanto você navega por eles, ajudando os agentes a entender rapidamente o contexto e oferecer soluções direcionadas."
  fr: "Si cette option est activée, Termloc indexera automatiquement les dépôts de code pendant que vous les parcourez, pour aider les agents à comprendre rapidement le contexte et à proposer des solutions ciblées."
  de: "Wenn aktiviert, indiziert Termloc Code-Repositorys automatisch, während Sie darin navigieren – damit Agenten den Kontext schnell verstehen und gezielte Lösungen anbieten können."
  it: "Se attivato, Termloc indicizzerà automaticamente i repository di codice mentre li esplori, aiutando gli agenti a comprendere rapidamente il contesto e a proporre soluzioni mirate."
  uk: "Якщо ввімкнено, Termloc автоматично індексуватиме репозиторії коду, коли ви ними переміщуєтеся, — щоб агенти швидко розуміли контекст і пропонували точні рішення."
  ja: "有効にすると、Termloc はコードリポジトリを移動するときに自動的にインデックスを作成し、エージェントがコンテキストをすばやく把握して的確な解決策を提示できるようにします。"
  zh-Hans: "启用后，Termloc 会在你浏览代码仓库时自动为其建立索引，帮助代理快速理解上下文并提供有针对性的解决方案。"

