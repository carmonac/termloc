"Set the boundaries for how your Agent operates. Choose what it can access, how much autonomy it has, and when it must ask for your approval. You can also fine-tune behavior around natural language input, codebase awareness, and more.":
  es: "Define los límites de cómo funciona tu agente. Elige a qué puede acceder, cuánta autonomía tiene y cuándo debe pedirte aprobación. También puedes ajustar su comportamiento con la entrada en lenguaje natural, el conocimiento del código y más."
  pt: "Defina os limites de como seu agente opera. Escolha o que ele pode acessar, quanta autonomia ele tem e quando deve pedir sua aprovação. Você também pode ajustar o comportamento com entrada em linguagem natural, conhecimento do código e muito mais."
  fr: "Définissez les limites du fonctionnement de votre agent. Choisissez ce à quoi il peut accéder, son degré d'autonomie et quand il doit demander votre approbation. Vous pouvez aussi affiner son comportement concernant la saisie en langage naturel, la connaissance du code, et plus encore."
  de: "Legen Sie fest, wie Ihr Agent arbeitet: worauf er zugreifen darf, wie viel Autonomie er hat und wann er Ihre Zustimmung einholen muss. Außerdem können Sie das Verhalten bei Eingaben in natürlicher Sprache, beim Codebase-Verständnis und mehr feinabstimmen."
  it: "Imposta i limiti del funzionamento del tuo agente. Scegli a cosa può accedere, quanta autonomia ha e quando deve chiedere la tua approvazione. Puoi anche perfezionare il comportamento per l'input in linguaggio naturale, la conoscenza del codice e altro ancora."
  uk: "Визначте межі роботи вашого агента: до чого він має доступ, наскільки він автономний і коли має запитувати ваше схвалення. Також можна налаштувати поведінку щодо введення природною мовою, обізнаності з кодовою базою тощо."
  ja: "エージェントの動作範囲を設定します。アクセスできる対象、自律性の程度、承認を求めるタイミングを選択できます。自然言語入力やコードベースの把握などの動作も細かく調整できます。"
  zh-Hans: "为代理的运行方式设定边界：选择它可以访问的内容、拥有多少自主权，以及何时必须征得你的批准。你还可以微调自然语言输入、代码库感知等方面的行为。"

