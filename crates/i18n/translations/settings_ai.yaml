"Add MCP servers to extend the Local Agent's capabilities. MCP servers expose data sources or tools to agents through a standardized interface, essentially acting like plugins. Add a custom server, or use the presets to get started with popular servers. You can also find team servers that have been shared with you here.":
  es: "Añade servidores MCP para ampliar las capacidades del agente local. Los servidores MCP ofrecen fuentes de datos o herramientas a los agentes mediante una interfaz estándar, y funcionan básicamente como plugins. Añade un servidor personalizado o usa los ajustes predefinidos para empezar con servidores populares. Aquí también encontrarás los servidores de equipo que se han compartido contigo."
  pt: "Adicione servidores MCP para ampliar os recursos do agente local. Os servidores MCP expõem fontes de dados ou ferramentas aos agentes por meio de uma interface padronizada, funcionando basicamente como plugins. Adicione um servidor personalizado ou use as predefinições para começar com servidores populares. Aqui você também encontra os servidores de equipe compartilhados com você."
  fr: "Ajoutez des serveurs MCP pour étendre les capacités de l'agent local. Les serveurs MCP exposent des sources de données ou des outils aux agents via une interface standardisée, comme des plugins. Ajoutez un serveur personnalisé ou utilisez les préréglages pour démarrer avec des serveurs populaires. Vous trouverez aussi ici les serveurs d'équipe partagés avec vous."
  de: "Fügen Sie MCP-Server hinzu, um die Fähigkeiten des lokalen Agenten zu erweitern. MCP-Server stellen Agenten Datenquellen oder Tools über eine standardisierte Schnittstelle bereit und funktionieren im Grunde wie Plugins. Fügen Sie einen eigenen Server hinzu oder starten Sie mit den Vorlagen für beliebte Server. Hier finden Sie auch Team-Server, die mit Ihnen geteilt wurden."
  it: "Aggiungi server MCP per estendere le capacità dell'agente locale. I server MCP espongono fonti di dati o strumenti agli agenti tramite un'interfaccia standard, funzionando in pratica come plugin. Aggiungi un server personalizzato o usa le preimpostazioni per iniziare con i server più diffusi. Qui trovi anche i server del team condivisi con te."
  uk: "Додавайте сервери MCP, щоб розширити можливості локального агента. Сервери MCP надають агентам джерела даних або інструменти через стандартизований інтерфейс і по суті працюють як плагіни. Додайте власний сервер або скористайтеся готовими налаштуваннями для популярних серверів. Тут також можна знайти сервери команди, якими з вами поділилися."
  ja: "MCP サーバーを追加すると、ローカルエージェントの機能を拡張できます。MCP サーバーは標準化されたインターフェイスを通じてデータソースやツールをエージェントに提供する、プラグインのようなものです。カスタムサーバーを追加するか、プリセットを使って人気のサーバーから始めましょう。共有されたチームのサーバーもここで確認できます。"
  zh-Hans: "添加 MCP 服务器以扩展本地代理的能力。MCP 服务器通过标准化接口向代理提供数据源或工具，本质上相当于插件。你可以添加自定义服务器，或使用预设快速开始使用热门服务器。你还可以在此找到与你共享的团队服务器。"

