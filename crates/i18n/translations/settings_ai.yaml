"Termloc can automatically index code repositories as you navigate them, helping agents quickly understand context and provide solutions. Code stays on this machine, or on the Ollama server you set up. If a codebase is unable to be indexed, Termloc can still navigate your codebase and gain insights via grep and find tool calling.":
  es: "Termloc puede indexar automáticamente los repositorios de código mientras los recorres, para que los agentes entiendan rápidamente el contexto y propongan soluciones. El código se queda en este equipo o en el servidor de Ollama que configures. Si no se puede indexar un código, Termloc puede seguir recorriéndolo y obtener información mediante las herramientas grep y find."
  pt: "O Termloc pode indexar automaticamente os repositórios de código enquanto você navega por eles, ajudando os agentes a entender rapidamente o contexto e oferecer soluções. O código fica nesta máquina ou no servidor Ollama que você configurar. Se não for possível indexar um código, o Termloc ainda pode navegar por ele e obter informações com as ferramentas grep e find."
  fr: "Termloc peut indexer automatiquement les dépôts de code pendant que vous les parcourez, pour aider les agents à comprendre rapidement le contexte et à proposer des solutions. Le code reste sur cette machine ou sur le serveur Ollama que vous avez configuré. Si un code ne peut pas être indexé, Termloc peut tout de même le parcourir et en tirer des informations grâce aux outils grep et find."
  de: "Termloc kann Code-Repositorys automatisch indizieren, während Sie darin navigieren, damit Agenten den Kontext schnell verstehen und Lösungen anbieten können. Der Code bleibt auf diesem Rechner oder auf dem von Ihnen eingerichteten Ollama-Server. Kann eine Codebase nicht indiziert werden, kann Termloc sie trotzdem durchsuchen und über die Tools grep und find Erkenntnisse gewinnen."
  it: "Termloc può indicizzare automaticamente i repository di codice mentre li esplori, aiutando gli agenti a comprendere rapidamente il contesto e a proporre soluzioni. Il codice resta su questo computer o sul server Ollama che hai configurato. Se un codice non può essere indicizzato, Termloc può comunque esplorarlo e ricavarne informazioni tramite gli strumenti grep e find."
  uk: "Termloc може автоматично індексувати репозиторії коду, коли ви ними переміщуєтеся, щоб агенти швидко розуміли контекст і пропонували рішення. Код залишається на цьому комп'ютері або на налаштованому вами сервері Ollama. Якщо кодову базу неможливо проіндексувати, Termloc все одно може переміщуватися нею й отримувати відомості за допомогою інструментів grep і find."
  ja: "Termloc は、コードリポジトリを移動するときに自動的にインデックスを作成し、エージェントがコンテキストをすばやく把握して解決策を提示できるようにします。コードはこのマシン、または設定した Ollama サーバーに保持されます。コードベースのインデックスを作成できない場合でも、Termloc は grep や find のツール呼び出しでコードベースを探索し、情報を得られます。"
  zh-Hans: "Termloc 可以在你浏览代码仓库时自动为其建立索引，帮助代理快速理解上下文并提供解决方案。代码保留在本机或你设置的 Ollama 服务器上。如果无法为某个代码库建立索引，Termloc 仍可通过 grep 和 find 工具调用浏览代码库并获取信息。"

"To exclude specific files or directories from indexing, add them to the .warpindexingignore file in your repository directory. These files will still be accessible to AI features, but they won't be included in codebase embeddings.":
  es: "Para excluir archivos o directorios concretos de la indexación, añádelos al archivo .warpindexingignore del directorio de tu repositorio. Las funciones de IA podrán seguir accediendo a esos archivos, pero no se incluirán en los embeddings del código."
  pt: "Para excluir arquivos ou diretórios específicos da indexação, adicione-os ao arquivo .warpindexingignore no diretório do repositório. Esses arquivos continuarão acessíveis aos recursos de IA, mas não serão incluídos nos embeddings do código."
  fr: "Pour exclure certains fichiers ou répertoires de l'indexation, ajoutez-les au fichier .warpindexingignore du répertoire de votre dépôt. Ces fichiers resteront accessibles aux fonctionnalités d'IA, mais ne seront pas inclus dans les embeddings du code."
  de: "Um bestimmte Dateien oder Verzeichnisse von der Indizierung auszuschließen, fügen Sie sie der Datei .warpindexingignore in Ihrem Repository-Verzeichnis hinzu. Diese Dateien bleiben für KI-Funktionen zugänglich, werden aber nicht in die Codebase-Embeddings aufgenommen."
  it: "Per escludere file o directory specifici dall'indicizzazione, aggiungili al file .warpindexingignore nella directory del repository. Questi file resteranno accessibili alle funzionalità di IA, ma non saranno inclusi negli embedding del codice."
  uk: "Щоб виключити певні файли чи каталоги з індексування, додайте їх до файлу .warpindexingignore у каталозі репозиторію. Ці файли залишаться доступними для функцій ШІ, але не потраплять до ембедингів кодової бази."
  ja: "特定のファイルやディレクトリをインデックスの対象から外すには、リポジトリのディレクトリにある .warpindexingignore ファイルに追加してください。これらのファイルは AI 機能から引き続き利用できますが、コードベースの埋め込みには含まれません。"
  zh-Hans: "要将特定文件或目录排除在索引之外，请将它们添加到仓库目录中的 .warpindexingignore 文件。AI 功能仍可访问这些文件，但它们不会包含在代码库嵌入中。"

