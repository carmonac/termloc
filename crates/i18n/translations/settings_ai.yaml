"Allow the Local Agent to generate an outline of your codebase that can be used for context. No code is ever stored on our servers.":
  es: "Permite que el agente local genere un esquema de tu código para usarlo como contexto. Nunca se almacena código en nuestros servidores."
  pt: "Permita que o agente local gere um esboço do seu código para usar como contexto. Nenhum código é armazenado em nossos servidores."
  fr: "Autorisez l'agent local à générer un aperçu de votre code utilisable comme contexte. Aucun code n'est jamais stocké sur nos serveurs."
  de: "Erlauben Sie dem lokalen Agenten, eine Übersicht Ihrer Codebase zu erstellen, die als Kontext genutzt werden kann. Es wird niemals Code auf unseren Servern gespeichert."
  it: "Consenti all'agente locale di generare una struttura del codice da usare come contesto. Nessun codice viene mai archiviato sui nostri server."
  uk: "Дозволити локальному агенту створювати структуру вашої кодової бази для використання як контекст. Код ніколи не зберігається на наших серверах."
  ja: "ローカルエージェントが、コンテキストとして使えるコードベースの概要を生成することを許可します。コードがサーバーに保存されることはありません。"
  zh-Hans: "允许本地代理生成可用作上下文的代码库大纲。代码绝不会存储在我们的服务器上。"

