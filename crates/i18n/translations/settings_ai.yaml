"When enabled, fast forward and auto-approve run denylisted commands without asking for confirmation.":
  es: "Si está activado, el avance rápido y la aprobación automática ejecutan los comandos bloqueados sin pedir confirmación."
  pt: "Quando ativado, o avanço rápido e a aprovação automática executam comandos bloqueados sem pedir confirmação."
  fr: "Si cette option est activée, l'avance rapide et l'approbation automatique exécutent les commandes interdites sans demander de confirmation."
  de: "Wenn aktiviert, führen Schnellvorlauf und automatische Genehmigung gesperrte Befehle ohne Bestätigung aus."
  it: "Se attivato, l'avanzamento rapido e l'approvazione automatica eseguono i comandi bloccati senza chiedere conferma."
  uk: "Якщо ввімкнено, швидке виконання та автосхвалення запускають заборонені команди без запиту підтвердження."
  ja: "有効にすると、早送りと自動承認で拒否リストのコマンドが確認なしで実行されます。"
  zh-Hans: "启用后，快进和自动批准将直接运行拒绝列表中的命令，而不请求确认。"

