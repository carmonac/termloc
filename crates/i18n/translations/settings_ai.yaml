  ja: "サードパーティのエージェントのサーバーを自動起動"
  zh-Hans: "自动启动第三方代理的服务器"

"Automatically detect and spawn MCP servers from globally-scoped third-party AI agent configuration files (e.g. in your home directory). Servers detected inside a repository are never spawned automatically and must be enabled individually in the \"Detected from\" sections below.":
  es: "Detecta e inicia automáticamente servidores MCP a partir de archivos de configuración globales de agentes de IA de terceros (por ejemplo, en tu directorio personal). Los servidores detectados dentro de un repositorio nunca se inician automáticamente y deben activarse uno a uno en las secciones «Detectado en» de abajo."
  pt: "Detecta e inicia automaticamente servidores MCP a partir de arquivos de configuração globais de agentes de IA de terceiros (por exemplo, no seu diretório pessoal). Servidores detectados dentro de um repositório nunca são iniciados automaticamente e precisam ser ativados individualmente nas seções “Detectado em” abaixo."
  fr: "Détecte et lance automatiquement les serveurs MCP à partir des fichiers de configuration globaux d'agents d'IA tiers (par exemple dans votre répertoire personnel). Les serveurs détectés dans un dépôt ne sont jamais lancés automatiquement et doivent être activés individuellement dans les sections « Détecté depuis » ci-dessous."
  de: "Erkennt und startet automatisch MCP-Server aus global gültigen Konfigurationsdateien von KI-Agenten anderer Anbieter (z. B. in Ihrem Home-Verzeichnis). In einem Repository erkannte Server werden nie automatisch gestartet und müssen in den Abschnitten „Erkannt aus“ unten einzeln aktiviert werden."
  it: "Rileva e avvia automaticamente i server MCP dai file di configurazione globali di agenti IA di terze parti (ad esempio nella tua directory home). I server rilevati all'interno di un repository non vengono mai avviati automaticamente e devono essere attivati singolarmente nelle sezioni “Rilevato da” qui sotto."
  uk: "Автоматично виявляти й запускати сервери MCP з глобальних файлів конфігурації сторонніх агентів ШІ (наприклад, у вашому домашньому каталозі). Сервери, виявлені всередині репозиторію, ніколи не запускаються автоматично — їх потрібно ввімкнути окремо в розділах «Виявлено з» нижче."
  ja: "グローバルなサードパーティ AI エージェントの設定ファイル（ホームディレクトリ内など）から MCP サーバーを自動的に検出して起動します。リポジトリ内で検出されたサーバーは自動的に起動されないため、下の「検出元」セクションで個別に有効にする必要があります。"
  zh-Hans: "自动从全局范围的第三方 AI 代理配置文件（例如主目录中的文件）检测并启动 MCP 服务器。在仓库中检测到的服务器绝不会自动启动，必须在下方的“检测来源”部分中逐个启用。"

