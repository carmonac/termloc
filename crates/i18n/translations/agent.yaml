"`/add-mcp` to add an MCP server to your workspace.":
  es: "`/add-mcp` para añadir un servidor MCP a tu espacio de trabajo."
  pt: "`/add-mcp` para adicionar um servidor MCP ao seu espaço de trabalho."
  fr: "`/add-mcp` pour ajouter un serveur MCP à votre espace de travail."
  de: "`/add-mcp`, um Ihrem Arbeitsbereich einen MCP-Server hinzuzufügen."
  it: "`/add-mcp` per aggiungere un server MCP al tuo spazio di lavoro."
  uk: "`/add-mcp`, щоб додати сервер MCP до робочого простору."
  ja: "`/add-mcp` でワークスペースに MCP サーバーを追加できます。"
  zh-Hans: "使用 `/add-mcp` 向工作区添加 MCP 服务器。"
"`/open-mcp-servers` to view and share MCP servers with your team.":
  es: "`/open-mcp-servers` para ver y compartir servidores MCP con tu equipo."
  pt: "`/open-mcp-servers` para ver e compartilhar servidores MCP com sua equipe."
  fr: "`/open-mcp-servers` pour afficher et partager des serveurs MCP avec votre équipe."
  de: "`/open-mcp-servers`, um MCP-Server anzuzeigen und mit Ihrem Team zu teilen."
  it: "`/open-mcp-servers` per visualizzare e condividere server MCP con il tuo team."
  uk: "`/open-mcp-servers`, щоб переглядати сервери MCP і ділитися ними з командою."
  ja: "`/open-mcp-servers` で MCP サーバーを表示し、チームと共有できます。"
  zh-Hans: "使用 `/open-mcp-servers` 查看 MCP 服务器并与团队共享。"
"`/create-environment` to turn a repo into a remote docker environment an agent can run in.":
  es: "`/create-environment` para convertir un repositorio en un entorno docker remoto en el que pueda ejecutarse un agente."
  pt: "`/create-environment` para transformar um repositório em um ambiente docker remoto onde um agente pode ser executado."
  fr: "`/create-environment` pour transformer un dépôt en environnement docker distant dans lequel un agent peut s'exécuter."
  de: "`/create-environment`, um ein Repository in eine entfernte Docker-Umgebung zu verwandeln, in der ein Agent laufen kann."
  it: "`/create-environment` per trasformare un repository in un ambiente docker remoto in cui un agente può essere eseguito."
  uk: "`/create-environment`, щоб перетворити репозиторій на віддалене docker-середовище, де може працювати агент."
  ja: "`/create-environment` でリポジトリを、エージェントが実行できるリモート docker 環境に変換できます。"
  zh-Hans: "使用 `/create-environment` 将仓库转换为代理可运行的远程 docker 环境。"
"`/add-prompt` to create a reusable prompt for repeatable workflows.":
  es: "`/add-prompt` para crear un prompt reutilizable para flujos de trabajo repetitivos."
  pt: "`/add-prompt` para criar um prompt reutilizável para fluxos de trabalho repetitivos."
  fr: "`/add-prompt` pour créer un prompt réutilisable pour les workflows récurrents."
  de: "`/add-prompt`, um einen wiederverwendbaren Prompt für wiederkehrende Workflows zu erstellen."
  it: "`/add-prompt` per creare un prompt riutilizzabile per flussi di lavoro ripetitivi."
  uk: "`/add-prompt`, щоб створити повторно використовуваний запит для повторюваних робочих процесів."
  ja: "`/add-prompt` で繰り返し使うワークフロー用の再利用可能なプロンプトを作成できます。"
  zh-Hans: "使用 `/add-prompt` 为重复的工作流创建可复用提示。"
"`/add-rule` to create a global agent rule.":
  es: "`/add-rule` para crear una regla global del agente."
  pt: "`/add-rule` para criar uma regra global do agente."
  fr: "`/add-rule` pour créer une règle globale de l'agent."
  de: "`/add-rule`, um eine globale Agent-Regel zu erstellen."
  it: "`/add-rule` per creare una regola globale dell'agente."
  uk: "`/add-rule`, щоб створити глобальне правило агента."
  ja: "`/add-rule` でエージェントのグローバルルールを作成できます。"
  zh-Hans: "使用 `/add-rule` 创建全局代理规则。"
"`/fork` to create a fresh copy of the current conversation, optionally with a new prompt.":
  es: "`/fork` para crear una copia nueva de la conversación actual, opcionalmente con un nuevo prompt."
  pt: "`/fork` para criar uma nova cópia da conversa atual, opcionalmente com um novo prompt."
  fr: "`/fork` pour créer une nouvelle copie de la conversation actuelle, éventuellement avec un nouveau prompt."
  de: "`/fork`, um eine neue Kopie der aktuellen Unterhaltung zu erstellen, optional mit einem neuen Prompt."
  it: "`/fork` per creare una nuova copia della conversazione attuale, eventualmente con un nuovo prompt."
  uk: "`/fork`, щоб створити нову копію поточної розмови, за потреби з новим запитом."
  ja: "`/fork` で現在の会話の新しいコピーを作成できます (新しいプロンプトも指定可能)。"
  zh-Hans: "使用 `/fork` 创建当前对话的新副本，可选附带新提示。"
"`/open-code-review` to open the code review panel and inspect agent-generated diffs.":
  es: "`/open-code-review` para abrir el panel de revisión de código e inspeccionar los diffs generados por el agente."
  pt: "`/open-code-review` para abrir o painel de revisão de código e inspecionar os diffs gerados pelo agente."
  fr: "`/open-code-review` pour ouvrir le panneau de revue de code et inspecter les diffs générés par l'agent."
  de: "`/open-code-review`, um das Code-Review-Panel zu öffnen und vom Agenten erzeugte Diffs zu prüfen."
  it: "`/open-code-review` per aprire il pannello di revisione del codice ed esaminare i diff generati dall'agente."
  uk: "`/open-code-review`, щоб відкрити панель рев'ю коду й переглянути зміни, створені агентом."
  ja: "`/open-code-review` でコードレビューパネルを開き、エージェントが生成した差分を確認できます。"
  zh-Hans: "使用 `/open-code-review` 打开代码审查面板，检查代理生成的差异。"
"`/new` to start a new agent conversation with clean context.":
  es: "`/new` para iniciar una nueva conversación con el agente con un contexto limpio."
  pt: "`/new` para iniciar uma nova conversa com o agente com contexto limpo."
  fr: "`/new` pour démarrer une nouvelle conversation avec l'agent avec un contexte vierge."
  de: "`/new`, um eine neue Agent-Unterhaltung mit leerem Kontext zu beginnen."
  it: "`/new` per avviare una nuova conversazione con l'agente con un contesto pulito."
  uk: "`/new`, щоб почати нову розмову з агентом із чистим контекстом."
  ja: "`/new` でクリーンなコンテキストの新しいエージェント会話を開始できます。"
  zh-Hans: "使用 `/new` 以全新上下文开始新的代理对话。"
"`/compact` to summarize the current conversation and free up space in the context window.":
  es: "`/compact` para resumir la conversación actual y liberar espacio en la ventana de contexto."
  pt: "`/compact` para resumir a conversa atual e liberar espaço na janela de contexto."
  fr: "`/compact` pour résumer la conversation actuelle et libérer de l'espace dans la fenêtre de contexte."
  de: "`/compact`, um die aktuelle Unterhaltung zusammenzufassen und Platz im Kontextfenster freizugeben."
  it: "`/compact` per riassumere la conversazione attuale e liberare spazio nella finestra di contesto."
  uk: "`/compact`, щоб підсумувати поточну розмову й звільнити місце в контекстному вікні."
  ja: "`/compact` で現在の会話を要約し、コンテキストウィンドウの空きを増やせます。"
  zh-Hans: "使用 `/compact` 总结当前对话，释放上下文窗口空间。"
"Right-click selected text to attach it as agent context.":
  es: "Haz clic derecho en el texto seleccionado para adjuntarlo como contexto del agente."
  pt: "Clique com o botão direito no texto selecionado para anexá-lo como contexto do agente."
  fr: "Faites un clic droit sur le texte sélectionné pour le joindre comme contexte de l'agent."
  de: "Klicken Sie mit der rechten Maustaste auf markierten Text, um ihn als Agent-Kontext anzuhängen."
  it: "Fai clic con il tasto destro sul testo selezionato per allegarlo come contesto dell'agente."
  uk: "Клацніть правою кнопкою на виділеному тексті, щоб додати його як контекст агента."
  ja: "選択したテキストを右クリックすると、エージェントのコンテキストとして添付できます。"
  zh-Hans: "右键单击所选文本，即可将其附加为代理上下文。"
"Use `AGENTS.md` or `CLAUDE.md` to apply project-scoped rules.":
  es: "Usa `AGENTS.md` o `CLAUDE.md` para aplicar reglas a nivel de proyecto."
  pt: "Use `AGENTS.md` ou `CLAUDE.md` para aplicar regras no escopo do projeto."
  fr: "Utilisez `AGENTS.md` ou `CLAUDE.md` pour appliquer des règles propres au projet."
  de: "Verwenden Sie `AGENTS.md` oder `CLAUDE.md`, um projektbezogene Regeln anzuwenden."
  it: "Usa `AGENTS.md` o `CLAUDE.md` per applicare regole a livello di progetto."
  uk: "Використовуйте `AGENTS.md` або `CLAUDE.md`, щоб застосувати правила на рівні проєкту."
  ja: "`AGENTS.md` または `CLAUDE.md` を使うと、プロジェクト単位のルールを適用できます。"
  zh-Hans: "使用 `AGENTS.md` 或 `CLAUDE.md` 应用项目级规则。"
"Paste a URL to attach that webpage as context for the agent.":
  es: "Pega una URL para adjuntar esa página web como contexto para el agente."
  pt: "Cole uma URL para anexar essa página da web como contexto para o agente."
  fr: "Collez une URL pour joindre cette page web comme contexte pour l'agent."
  de: "Fügen Sie eine URL ein, um diese Webseite als Kontext für den Agenten anzuhängen."
  it: "Incolla un URL per allegare quella pagina web come contesto per l'agente."
  uk: "Вставте URL-адресу, щоб додати цю вебсторінку як контекст для агента."
  ja: "URL を貼り付けると、その Web ページをエージェントのコンテキストとして添付できます。"
  zh-Hans: "粘贴网址，即可将该网页附加为代理上下文。"
"Enable shell integration in a remote SSH session to use the Local Agent there.":
  es: "Activa la integración del shell en una sesión SSH remota para usar allí el agente local."
  pt: "Ative a integração do shell em uma sessão SSH remota para usar o agente local nela."
  fr: "Activez l'intégration du shell dans une session SSH distante pour y utiliser l'agent local."
  de: "Aktivieren Sie die Shell-Integration in einer entfernten SSH-Sitzung, um dort den lokalen Agenten zu verwenden."
  it: "Attiva l'integrazione della shell in una sessione SSH remota per usare lì l'agente locale."
  uk: "Увімкніть інтеграцію оболонки у віддаленому сеансі SSH, щоб використовувати там локального агента."
  ja: "リモート SSH セッションでシェル統合を有効にすると、そこでローカルエージェントを使用できます。"
  zh-Hans: "在远程 SSH 会话中启用 Shell 集成，即可在其中使用本地代理。"
"Switch agent profiles to quickly change models and agent permissions.":
  es: "Cambia de perfil de agente para modificar rápidamente modelos y permisos del agente."
  pt: "Troque de perfil de agente para mudar rapidamente modelos e permissões do agente."
  fr: "Changez de profil d'agent pour modifier rapidement les modèles et les autorisations de l'agent."
  de: "Wechseln Sie das Agent-Profil, um Modelle und Agent-Berechtigungen schnell zu ändern."
  it: "Cambia profilo agente per modificare rapidamente modelli e autorizzazioni dell'agente."
  uk: "Перемикайте профілі агента, щоб швидко змінювати моделі й дозволи агента."
  ja: "エージェントプロファイルを切り替えると、モデルとエージェントの権限をすばやく変更できます。"
  zh-Hans: "切换代理配置文件，快速更改模型和代理权限。"
"`/init` to generate a `TERMLOC.md` file and define project rules for the agent.":
  es: "`/init` para generar un archivo `TERMLOC.md` y definir reglas de proyecto para el agente."
  pt: "`/init` para gerar um arquivo `TERMLOC.md` e definir regras de projeto para o agente."
  fr: "`/init` pour générer un fichier `TERMLOC.md` et définir des règles de projet pour l'agent."
  de: "`/init`, um eine `TERMLOC.md`-Datei zu erstellen und Projektregeln für den Agenten festzulegen."
  it: "`/init` per generare un file `TERMLOC.md` e definire regole di progetto per l'agente."
  uk: "`/init`, щоб створити файл `TERMLOC.md` і визначити правила проєкту для агента."
  ja: "`/init` で `TERMLOC.md` ファイルを生成し、エージェント向けのプロジェクトルールを定義できます。"
  zh-Hans: "使用 `/init` 生成 `TERMLOC.md` 文件，为代理定义项目规则。"
"<keybinding> to auto-approve the agent's commands and diffs for the rest of the session.":
  es: "<keybinding> para aprobar automáticamente los comandos y diffs del agente durante el resto de la sesión."
  pt: "<keybinding> para aprovar automaticamente os comandos e diffs do agente pelo resto da sessão."
  fr: "<keybinding> pour approuver automatiquement les commandes et diffs de l'agent pour le reste de la session."
  de: "<keybinding>, um die Befehle und Diffs des Agenten für den Rest der Sitzung automatisch zu genehmigen."
  it: "<keybinding> per approvare automaticamente comandi e diff dell'agente per il resto della sessione."
  uk: "<keybinding>, щоб автоматично схвалювати команди й зміни агента до кінця сеансу."
  ja: "<keybinding> で、セッションの残りの間エージェントのコマンドと差分を自動承認できます。"
  zh-Hans: "按 <keybinding> 在本次会话剩余时间内自动批准代理的命令和差异。"
"Enable desktop notifications to get an alert when an agent needs your attention.":
  es: "Activa las notificaciones de escritorio para recibir un aviso cuando un agente necesite tu atención."
  pt: "Ative as notificações da área de trabalho para receber um alerta quando um agente precisar da sua atenção."
  fr: "Activez les notifications de bureau pour être alerté lorsqu'un agent a besoin de votre attention."
  de: "Aktivieren Sie Desktop-Benachrichtigungen, um benachrichtigt zu werden, wenn ein Agent Ihre Aufmerksamkeit benötigt."
  it: "Attiva le notifiche desktop per ricevere un avviso quando un agente richiede la tua attenzione."
  uk: "Увімкніть сповіщення на робочому столі, щоб отримувати попередження, коли агент потребує вашої уваги."
  ja: "デスクトップ通知を有効にすると、エージェントが対応を必要としたときに通知を受け取れます。"
  zh-Hans: "启用桌面通知，在代理需要您关注时收到提醒。"
"<keybinding> to cancel the current agent task.":
  es: "<keybinding> para cancelar la tarea actual del agente."
  pt: "<keybinding> para cancelar a tarefa atual do agente."
  fr: "<keybinding> pour annuler la tâche actuelle de l'agent."
  de: "<keybinding>, um die aktuelle Agent-Aufgabe abzubrechen."
  it: "<keybinding> per annullare l'attività corrente dell'agente."
  uk: "<keybinding>, щоб скасувати поточне завдання агента."
  ja: "<keybinding> で現在のエージェントタスクをキャンセルできます。"
  zh-Hans: "按 <keybinding> 取消当前代理任务。"
"Hold <keybinding> to speak your prompt directly to the agent.":
  es: "Mantén pulsado <keybinding> para dictarle tu prompt directamente al agente."
  pt: "Mantenha <keybinding> pressionado para falar seu prompt diretamente ao agente."
  fr: "Maintenez <keybinding> enfoncé pour dicter votre prompt directement à l'agent."
  de: "Halten Sie <keybinding> gedrückt, um Ihren Prompt direkt an den Agenten zu sprechen."
  it: "Tieni premuto <keybinding> per dettare il prompt direttamente all'agente."
  uk: "Утримуйте <keybinding>, щоб надиктувати запит безпосередньо агенту."
  ja: "<keybinding> を長押しすると、プロンプトを音声で直接エージェントに伝えられます。"
  zh-Hans: "按住 <keybinding> 直接向代理说出您的提示。"
"Input exceeded context window limit.":
  es: "La entrada superó el límite de la ventana de contexto."
