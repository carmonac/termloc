"Summarization is already running. If you cancel now, the request may still incur cost, any progress so far will be lost, and restarting will take longer.\n\nAre you sure you want to cancel?":
  es: "El resumen ya está en curso. Si lo cancelas ahora, la solicitud puede generar costes igualmente, se perderá el progreso realizado y reiniciarlo llevará más tiempo.\n\n¿Seguro que quieres cancelarlo?"
  pt: "O resumo já está em andamento. Se você cancelar agora, a solicitação ainda poderá gerar custos, o progresso até aqui será perdido e reiniciar levará mais tempo.\n\nTem certeza de que deseja cancelar?"
  fr: "Le résumé est déjà en cours. Si vous l'annulez maintenant, la requête peut tout de même entraîner des coûts, la progression actuelle sera perdue et le redémarrage prendra plus de temps.\n\nVoulez-vous vraiment annuler ?"
  de: "Die Zusammenfassung läuft bereits. Wenn Sie jetzt abbrechen, können trotzdem Kosten für die Anfrage entstehen, der bisherige Fortschritt geht verloren und ein Neustart dauert länger.\n\nMöchten Sie wirklich abbrechen?"
  it: "Il riepilogo è già in corso. Se annulli ora, la richiesta potrebbe comunque comportare costi, i progressi fatti finora andranno persi e il riavvio richiederà più tempo.\n\nVuoi davvero annullare?"
  uk: "Підсумовування вже виконується. Якщо скасувати зараз, запит усе одно може спричинити витрати, поточний прогрес буде втрачено, а перезапуск займе більше часу.\n\nВи дійсно бажаєте скасувати?"
  ja: "要約はすでに実行中です。今キャンセルしても要求のコストが発生する場合があり、これまでの進行状況は失われ、再開には時間がかかります。\n\nキャンセルしてもよろしいですか?"
  zh-Hans: "总结已在进行中。如果现在取消，请求仍可能产生费用，当前进度将丢失，重新开始也需要更长时间。\n\n确定要取消吗？"
