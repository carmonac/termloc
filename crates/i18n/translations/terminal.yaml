  pt: "Substitua a entrada \"@warp-dot-dev/opencode-warp\" existente no array \"plugin\" pela versão explícita:"
  fr: "Remplacez l'entrée « @warp-dot-dev/opencode-warp » existante du tableau \"plugin\" par la version explicite :"
  de: "Ersetzen Sie den vorhandenen Eintrag \"@warp-dot-dev/opencode-warp\" im Array \"plugin\" durch die explizite Version:"
  it: "Sostituisci la voce \"@warp-dot-dev/opencode-warp\" esistente nell'array \"plugin\" con la versione esplicita:"
  uk: "Замініть наявний запис \"@warp-dot-dev/opencode-warp\" у масиві \"plugin\" на явну версію:"
