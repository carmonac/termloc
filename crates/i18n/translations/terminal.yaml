"Would you like to create an environment for this project so you can run cloud agents in it? The agent will guide you through choosing GitHub repos, configuring a Docker image, and specifying startup commands.":
  es: "¿Quieres crear un entorno para este proyecto y ejecutar agentes en la nube en él? El agente te guiará para elegir repositorios de GitHub, configurar una imagen de Docker e indicar los comandos de inicio."
  pt: "Deseja criar um ambiente para este projeto para executar agentes na nuvem nele? O agente vai orientar você na escolha de repositórios do GitHub, na configuração de uma imagem Docker e na definição dos comandos de inicialização."
  fr: "Voulez-vous créer un environnement pour ce projet afin d'y exécuter des agents cloud ? L'agent vous guidera pour choisir des dépôts GitHub, configurer une image Docker et définir les commandes de démarrage."
  de: "Möchten Sie eine Umgebung für dieses Projekt erstellen, um darin Cloud-Agenten auszuführen? Der Agent führt Sie durch die Auswahl von GitHub-Repositorys, die Konfiguration eines Docker-Images und die Festlegung von Startbefehlen."
  it: "Vuoi creare un ambiente per questo progetto in cui eseguire agenti cloud? L'agente ti guiderà nella scelta dei repository GitHub, nella configurazione di un'immagine Docker e nella definizione dei comandi di avvio."
  uk: "Створити середовище для цього проєкту, щоб запускати в ньому хмарних агентів? Агент допоможе вибрати репозиторії GitHub, налаштувати образ Docker і вказати команди запуску."
  ja: "このプロジェクト用の環境を作成して、クラウドエージェントを実行しますか？エージェントが GitHub リポジトリの選択、Docker イメージの設定、起動コマンドの指定を案内します。"
  zh-Hans: "要为此项目创建一个环境以便在其中运行云端代理吗？代理将引导你选择 GitHub 仓库、配置 Docker 镜像并指定启动命令。"
