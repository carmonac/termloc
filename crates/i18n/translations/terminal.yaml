"Would you like to create an AGENTS.md file? Termloc can create one for you with project specific rules, context, and conventions inferred from your codebase. The agent will use this context as it codes.":
  es: "¿Quieres crear un archivo AGENTS.md? Termloc puede crearlo con reglas, contexto y convenciones específicos del proyecto deducidos de tu código base. El agente usará este contexto al programar."
  pt: "Deseja criar um arquivo AGENTS.md? O Termloc pode criar um com regras, contexto e convenções específicos do projeto inferidos da sua base de código. O agente usará esse contexto ao programar."
  fr: "Voulez-vous créer un fichier AGENTS.md ? Termloc peut en créer un avec des règles, un contexte et des conventions propres au projet, déduits de votre base de code. L'agent utilisera ce contexte lorsqu'il code."
  de: "Möchten Sie eine AGENTS.md-Datei erstellen? Termloc kann eine mit projektspezifischen Regeln, Kontext und Konventionen erstellen, die aus Ihrer Codebasis abgeleitet werden. Der Agent nutzt diesen Kontext beim Programmieren."
  it: "Vuoi creare un file AGENTS.md? Termloc può crearne uno con regole, contesto e convenzioni specifici del progetto ricavati dalla codebase. L'agente userà questo contesto mentre scrive codice."
  uk: "Створити файл AGENTS.md? Termloc може створити його з правилами, контекстом і домовленостями проєкту, виведеними з вашої кодової бази. Агент використовуватиме цей контекст під час написання коду."
  ja: "AGENTS.md ファイルを作成しますか？Termloc がコードベースから推測したプロジェクト固有のルール、コンテキスト、規約を含むファイルを作成できます。エージェントはコーディング時にこのコンテキストを使用します。"
  zh-Hans: "要创建 AGENTS.md 文件吗？Termloc 可以根据你的代码库推断出项目特定的规则、上下文和约定，为你创建该文件。代理在编写代码时会使用这些上下文。"
