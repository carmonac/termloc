"Great - let's begin setting up this project! Would you like to give me permission to index this codebase? It allows me to quickly understand context and provide more targeted solutions when working in this codebase. No code is stored on Termloc servers.":
  es: "¡Genial, empecemos a configurar este proyecto! ¿Quieres darme permiso para indexar este código base? Así podré entender rápidamente el contexto y ofrecer soluciones más precisas al trabajar en él. No se almacena código en servidores de Termloc."
  pt: "Ótimo, vamos começar a configurar este projeto! Deseja me dar permissão para indexar esta base de código? Isso me permite entender rapidamente o contexto e oferecer soluções mais direcionadas ao trabalhar nela. Nenhum código é armazenado em servidores do Termloc."
  fr: "Parfait, commençons à configurer ce projet ! Voulez-vous m'autoriser à indexer cette base de code ? Cela me permet de comprendre rapidement le contexte et de proposer des solutions plus ciblées lorsque je travaille dessus. Aucun code n'est stocké sur les serveurs de Termloc."
  de: "Super – richten wir dieses Projekt ein! Möchten Sie mir erlauben, diese Codebasis zu indexieren? So kann ich den Kontext schnell erfassen und bei der Arbeit an dieser Codebasis gezieltere Lösungen anbieten. Es wird kein Code auf Termloc-Servern gespeichert."
  it: "Ottimo, iniziamo a configurare questo progetto! Vuoi darmi l'autorizzazione a indicizzare questa codebase? Mi permette di capire rapidamente il contesto e offrire soluzioni più mirate quando lavoro su di essa. Nessun codice viene archiviato sui server di Termloc."
  uk: "Чудово, почнімо налаштовувати цей проєкт! Дозволите мені індексувати цю кодову базу? Так я швидко зрозумію контекст і пропонуватиму точніші рішення під час роботи з нею. Код не зберігається на серверах Termloc."
  ja: "では、このプロジェクトのセットアップを始めましょう。このコードベースのインデックス作成を許可しますか？コンテキストをすばやく把握し、このコードベースでの作業時により的確な解決策を提案できるようになります。コードが Termloc のサーバーに保存されることはありません。"
  zh-Hans: "太好了，我们开始设置这个项目吧！你愿意允许我为此代码库建立索引吗？这能让我快速理解上下文，在此代码库中工作时提供更有针对性的解决方案。不会在 Termloc 服务器上存储任何代码。"
"It looks like this project has already been initialized. You can re-generate the AGENTS.md for this codebase by clicking the button below.":
  es: "Parece que este proyecto ya se inicializó. Puedes volver a generar el AGENTS.md de este código base con el botón de abajo."
  pt: "Parece que este projeto já foi inicializado. Você pode gerar novamente o AGENTS.md desta base de código clicando no botão abaixo."
  fr: "Ce projet semble déjà initialisé. Vous pouvez régénérer le fichier AGENTS.md de cette base de code en cliquant sur le bouton ci-dessous."
  de: "Dieses Projekt wurde anscheinend bereits initialisiert. Sie können die AGENTS.md für diese Codebasis über die Schaltfläche unten neu generieren."
  it: "Sembra che questo progetto sia già stato inizializzato. Puoi rigenerare il file AGENTS.md per questa codebase facendo clic sul pulsante qui sotto."
  uk: "Схоже, цей проєкт уже ініціалізовано. Ви можете повторно згенерувати AGENTS.md для цієї кодової бази, натиснувши кнопку нижче."
  ja: "このプロジェクトはすでに初期化されているようです。下のボタンをクリックすると、このコードベースの AGENTS.md を再生成できます。"
  zh-Hans: "此项目似乎已初始化。点击下方按钮可重新生成此代码库的 AGENTS.md。"
