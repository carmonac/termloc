"In remote subshells, Termloc runs commands in the background to power completions, syntax highlighting, and other features.":
  es: "En los subshells remotos, Termloc ejecuta comandos en segundo plano para ofrecer autocompletado, resaltado de sintaxis y otras funciones."
  pt: "Em subshells remotos, o Termloc executa comandos em segundo plano para oferecer preenchimento automático, realce de sintaxe e outros recursos."
  fr: "Dans les sous-shells distants, Termloc exécute des commandes en arrière-plan pour assurer les complétions, la coloration syntaxique et d'autres fonctionnalités."
  de: "In Remote-Subshells führt Termloc im Hintergrund Befehle aus, um Vervollständigungen, Syntaxhervorhebung und weitere Funktionen bereitzustellen."
  it: "Nelle subshell remote, Termloc esegue comandi in background per fornire completamenti, evidenziazione della sintassi e altre funzionalità."
  uk: "У віддалених підоболонках Termloc виконує команди у фоновому режимі для автодоповнення, підсвічування синтаксису та інших функцій."
  ja: "リモートのサブシェルでは、補完、構文ハイライトなどの機能を提供するために、Termloc がバックグラウンドでコマンドを実行します。"
  zh-Hans: "在远程子 Shell 中，Termloc 会在后台运行命令，以提供补全、语法高亮等功能。"
