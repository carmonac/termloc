"A terminal program tried to write to your clipboard. This is disabled by default for security reasons, to protect against malicious software.":
  es: "Un programa del terminal intentó escribir en tu portapapeles. Esto está desactivado de forma predeterminada por motivos de seguridad, para protegerte de software malicioso."
  pt: "Um programa do terminal tentou gravar na sua área de transferência. Isso fica desativado por padrão por motivos de segurança, para proteger contra software malicioso."
  fr: "Un programme du terminal a tenté d'écrire dans votre presse-papiers. Cette fonction est désactivée par défaut pour des raisons de sécurité, afin de vous protéger contre les logiciels malveillants."
  de: "Ein Terminalprogramm hat versucht, in Ihre Zwischenablage zu schreiben. Dies ist aus Sicherheitsgründen standardmäßig deaktiviert, um vor Schadsoftware zu schützen."
  it: "Un programma del terminale ha tentato di scrivere negli appunti. Questa funzione è disattivata per impostazione predefinita per motivi di sicurezza, per proteggerti da software dannoso."
  uk: "Програма в терміналі спробувала записати в буфер обміну. З міркувань безпеки це типово вимкнено для захисту від шкідливого ПЗ."
  ja: "ターミナルのプログラムがクリップボードに書き込もうとしました。悪意のあるソフトウェアから保護するため、セキュリティ上の理由でこれはデフォルトで無効になっています。"
  zh-Hans: "某个终端程序尝试写入你的剪贴板。为防范恶意软件，出于安全原因，此功能默认处于禁用状态。"
"A terminal program tried to read your clipboard. This is disabled by default for security reasons, to protect against malicious software.":
  es: "Un programa del terminal intentó leer tu portapapeles. Esto está desactivado de forma predeterminada por motivos de seguridad, para protegerte de software malicioso."
  pt: "Um programa do terminal tentou ler sua área de transferência. Isso fica desativado por padrão por motivos de segurança, para proteger contra software malicioso."
  fr: "Un programme du terminal a tenté de lire votre presse-papiers. Cette fonction est désactivée par défaut pour des raisons de sécurité, afin de vous protéger contre les logiciels malveillants."
  de: "Ein Terminalprogramm hat versucht, Ihre Zwischenablage zu lesen. Dies ist aus Sicherheitsgründen standardmäßig deaktiviert, um vor Schadsoftware zu schützen."
