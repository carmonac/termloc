"There are some known issues with Claude Code's plugin system. If the plugin is not found after step 1, you can try manually adding an \"extraKnownMarketplaces\" entry to ~/.claude/settings.json.":
  es: "El sistema de plugins de Claude Code tiene algunos problemas conocidos. Si no se encuentra el plugin después del paso 1, prueba a añadir manualmente una entrada \"extraKnownMarketplaces\" a ~/.claude/settings.json."
  pt: "O sistema de plugins do Claude Code tem alguns problemas conhecidos. Se o plugin não for encontrado após a etapa 1, tente adicionar manualmente uma entrada \"extraKnownMarketplaces\" a ~/.claude/settings.json."
  fr: "Le système de plugins de Claude Code présente quelques problèmes connus. Si le plugin est introuvable après l'étape 1, essayez d'ajouter manuellement une entrée « extraKnownMarketplaces » à ~/.claude/settings.json."
  de: "Das Plugin-System von Claude Code hat einige bekannte Probleme. Wenn das Plugin nach Schritt 1 nicht gefunden wird, können Sie versuchen, manuell einen Eintrag „extraKnownMarketplaces“ zu ~/.claude/settings.json hinzuzufügen."
  it: "Il sistema di plugin di Claude Code presenta alcuni problemi noti. Se il plugin non viene trovato dopo il passaggio 1, prova ad aggiungere manualmente una voce \"extraKnownMarketplaces\" a ~/.claude/settings.json."
