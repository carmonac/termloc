"Pin the plugin to the latest version in your opencode.json. OpenCode caches plugins per version spec, so changing the pin forces it to re-fetch on restart.":
  es: "Fija el plugin a la última versión en tu opencode.json. OpenCode almacena en caché los plugins por especificación de versión, así que al cambiarla los vuelve a descargar al reiniciar."
  pt: "Fixe o plugin na versão mais recente no seu opencode.json. O OpenCode armazena plugins em cache por especificação de versão, então alterar a versão fixada força um novo download ao reiniciar."
  fr: "Épinglez le plugin à la dernière version dans votre opencode.json. OpenCode met en cache les plugins par spécification de version ; modifier l'épinglage le force donc à les récupérer à nouveau au redémarrage."
  de: "Legen Sie das Plugin in Ihrer opencode.json auf die neueste Version fest. OpenCode speichert Plugins pro Versionsangabe im Cache, daher erzwingt eine Änderung ein erneutes Abrufen beim Neustart."
  it: "Blocca il plugin all'ultima versione nel file opencode.json. OpenCode memorizza nella cache i plugin per specifica di versione, quindi cambiarla forza un nuovo download al riavvio."
  uk: "Закріпіть плагін на останній версії в opencode.json. OpenCode кешує плагіни за специфікацією версії, тож зміна закріплення змусить його повторно завантажити плагін під час перезапуску."
  ja: "opencode.json でプラグインを最新バージョンに固定してください。OpenCode はバージョン指定ごとにプラグインをキャッシュするため、固定を変更すると再起動時に再取得されます。"
  zh-Hans: "在 opencode.json 中将插件固定到最新版本。OpenCode 会按版本规格缓存插件，因此更改固定版本会强制其在重启时重新获取。"
"Replace the existing \"@warp-dot-dev/opencode-warp\" entry in the \"plugin\" array with the explicit version:":
