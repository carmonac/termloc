"Unlock smarter, more consistent responses by letting the Agent understand your codebase and generate rules for it. You can also do this at any point by running /init":
  es: "Obtén respuestas más inteligentes y coherentes dejando que el agente entienda tu código base y genere reglas para él. También puedes hacerlo en cualquier momento ejecutando /init"
  pt: "Receba respostas mais inteligentes e consistentes permitindo que o agente entenda sua base de código e gere regras para ela. Você também pode fazer isso a qualquer momento executando /init"
  fr: "Obtenez des réponses plus pertinentes et cohérentes en laissant l'agent comprendre votre base de code et générer des règles pour celle-ci. Vous pouvez aussi le faire à tout moment en exécutant /init"
  de: "Erhalten Sie intelligentere, konsistentere Antworten, indem Sie den Agenten Ihre Codebasis verstehen und Regeln dafür erstellen lassen. Sie können dies auch jederzeit mit /init tun"
  it: "Ottieni risposte più intelligenti e coerenti lasciando che l'agente comprenda la codebase e generi regole per essa. Puoi farlo anche in qualsiasi momento eseguendo /init"
  uk: "Отримуйте розумніші та послідовніші відповіді, дозволивши агенту зрозуміти вашу кодову базу та створити для неї правила. Це також можна зробити будь-коли, виконавши /init"
  ja: "エージェントにコードベースを理解させてルールを生成させると、よりスマートで一貫した応答が得られます。/init を実行すればいつでも行えます"
  zh-Hans: "让代理理解你的代码库并为其生成规则，即可获得更智能、更一致的回复。你也可以随时运行 /init 来执行此操作"
