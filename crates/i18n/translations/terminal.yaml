"You're using the base agent. Full terminal use models only apply to the full terminal use agent.":
  es: "Estás usando el agente base. Los modelos de uso completo del terminal solo se aplican al agente de uso completo del terminal."
  pt: "Você está usando o agente base. Os modelos de uso completo do terminal só se aplicam ao agente de uso completo do terminal."
  fr: "Vous utilisez l'agent de base. Les modèles d'utilisation complète du terminal ne s'appliquent qu'à l'agent d'utilisation complète du terminal."
  de: "Sie verwenden den Basis-Agenten. Modelle für die volle Terminalnutzung gelten nur für den Agenten mit voller Terminalnutzung."
  it: "Stai usando l'agente base. I modelli per l'uso completo del terminale si applicano solo all'agente per l'uso completo del terminale."
  uk: "Ви використовуєте базового агента. Моделі повного використання термінала застосовуються лише до агента повного використання термінала."
  ja: "ベースエージェントを使用しています。ターミナルのフル使用モデルは、ターミナルのフル使用エージェントにのみ適用されます。"
  zh-Hans: "你正在使用基础代理。完整终端使用模型仅适用于完整终端使用代理。"
"You're using the full terminal use agent. Base models only apply to the base agent.":
  es: "Estás usando el agente de uso completo del terminal. Los modelos base solo se aplican al agente base."
  pt: "Você está usando o agente de uso completo do terminal. Os modelos base só se aplicam ao agente base."
  fr: "Vous utilisez l'agent d'utilisation complète du terminal. Les modèles de base ne s'appliquent qu'à l'agent de base."
  de: "Sie verwenden den Agenten mit voller Terminalnutzung. Basismodelle gelten nur für den Basis-Agenten."
  it: "Stai usando l'agente per l'uso completo del terminale. I modelli base si applicano solo all'agente base."
  uk: "Ви використовуєте агента повного використання термінала. Базові моделі застосовуються лише до базового агента."
  ja: "ターミナルのフル使用エージェントを使用しています。ベースモデルはベースエージェントにのみ適用されます。"
  zh-Hans: "你正在使用完整终端使用代理。基础模型仅适用于基础代理。"
