"When this setting is enabled, Termloc will scan blocks, the contents of Drive objects, and Local Agent prompts for potential sensitive information and prevent saving or sending this data to any servers. You can customize this list via regexes.":
  es: "Cuando este ajuste está activado, Termloc analiza los bloques, el contenido de los objetos de Drive y las solicitudes al agente local en busca de información potencialmente confidencial, y evita que estos datos se guarden o se envíen a ningún servidor. Puedes personalizar esta lista con regex."
  pt: "Quando esta configuração está ativada, o Termloc verifica blocos, o conteúdo de objetos do Drive e os prompts do agente local em busca de informações potencialmente confidenciais e impede que esses dados sejam salvos ou enviados a qualquer servidor. Você pode personalizar esta lista com regexes."
  fr: "Lorsque ce paramètre est activé, Termloc analyse les blocs, le contenu des objets Drive et les invites de l'agent local à la recherche d'informations potentiellement sensibles, et empêche l'enregistrement ou l'envoi de ces données à un serveur. Vous pouvez personnaliser cette liste à l'aide de regex."
  de: "Wenn diese Einstellung aktiviert ist, durchsucht Termloc Blöcke, den Inhalt von Drive-Objekten und Prompts des lokalen Agenten nach möglicherweise vertraulichen Informationen und verhindert, dass diese Daten gespeichert oder an Server gesendet werden. Sie können diese Liste mit Regexes anpassen."
  it: "Quando questa impostazione è attiva, Termloc analizza i blocchi, il contenuto degli oggetti di Drive e i prompt dell'agente locale alla ricerca di informazioni potenzialmente sensibili e impedisce che questi dati vengano salvati o inviati a qualsiasi server. Puoi personalizzare questo elenco tramite regex."
  uk: "Коли це налаштування ввімкнено, Termloc перевіряє блоки, вміст об'єктів Drive і запити до локального агента на наявність потенційно конфіденційної інформації та не дає зберігати чи надсилати ці дані на будь-які сервери. Цей список можна налаштувати за допомогою regex."
  ja: "この設定を有効にすると、Termloc はブロック、Drive オブジェクトの内容、ローカルエージェントへのプロンプトに機密情報が含まれていないかをスキャンし、そのデータの保存やサーバーへの送信を防ぎます。このリストは正規表現でカスタマイズできます。"
  zh-Hans: "启用此设置后，Termloc 会扫描块、Drive 对象的内容以及本地智能体提示词中可能存在的敏感信息，并阻止保存这些数据或将其发送到任何服务器。你可以通过正则表达式自定义此列表。"

