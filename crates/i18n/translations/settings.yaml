"Drive is a workspace in your terminal where you can save Workflows, Notebooks, Prompts, and Environment Variables for personal use or to share with a team.":
  es: "Drive es un espacio de trabajo en tu terminal donde puedes guardar flujos de trabajo, cuadernos, prompts y variables de entorno para uso personal o para compartir con un equipo."
  pt: "O Drive é um espaço de trabalho no seu terminal onde você pode salvar fluxos de trabalho, notebooks, prompts e variáveis de ambiente para uso pessoal ou para compartilhar com uma equipe."
  fr: "Drive est un espace de travail dans votre terminal où vous pouvez enregistrer des workflows, des notebooks, des prompts et des variables d'environnement pour un usage personnel ou pour les partager avec une équipe."
  de: "Drive ist ein Arbeitsbereich in Ihrem Terminal, in dem Sie Workflows, Notebooks, Prompts und Umgebungsvariablen für den persönlichen Gebrauch speichern oder mit einem Team teilen können."
  it: "Drive è uno spazio di lavoro nel terminale in cui puoi salvare workflow, notebook, prompt e variabili d'ambiente per uso personale o da condividere con un team."
  uk: "Drive — це робочий простір у вашому терміналі, де можна зберігати робочі процеси, блокноти, промпти та змінні середовища для особистого використання або спільного доступу з командою."
  ja: "Drive はターミナル内のワークスペースで、ワークフロー、ノートブック、プロンプト、環境変数を保存して個人で使ったりチームと共有したりできます。"
  zh-Hans: "Drive 是终端中的工作区，可用于保存工作流、笔记本、提示词和环境变量，供个人使用或与团队共享。"

