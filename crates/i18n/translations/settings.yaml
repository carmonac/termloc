"Use regex to define additional secrets or data you'd like to redact. This will take effect when the next command runs. You can use the inline (?i) flag as a prefix to your regex to make it case-insensitive.":
  es: "Usa regex para definir otros secretos o datos que quieras ocultar. Se aplicará al ejecutar el siguiente comando. Puedes usar el indicador en línea (?i) como prefijo de la regex para que no distinga mayúsculas de minúsculas."
  pt: "Use regex para definir segredos ou dados adicionais que você deseja ocultar. Isso entrará em vigor quando o próximo comando for executado. Você pode usar a flag inline (?i) como prefixo da regex para ignorar maiúsculas e minúsculas."
  fr: "Utilisez des regex pour définir d'autres secrets ou données à masquer. Cela prendra effet à l'exécution de la prochaine commande. Vous pouvez préfixer votre regex de l'indicateur (?i) pour ignorer la casse."
  de: "Definieren Sie mit Regex weitere Geheimnisse oder Daten, die geschwärzt werden sollen. Dies wird beim nächsten ausgeführten Befehl wirksam. Mit dem Inline-Flag (?i) als Präfix wird die Groß-/Kleinschreibung ignoriert."
  it: "Usa le regex per definire altri segreti o dati da oscurare. La modifica avrà effetto all'esecuzione del comando successivo. Puoi usare il flag inline (?i) come prefisso della regex per ignorare maiuscole e minuscole."
  uk: "Використовуйте regex, щоб визначити додаткові секрети або дані, які потрібно приховувати. Зміни набудуть чинності під час виконання наступної команди. Щоб ігнорувати регістр, додайте до regex префікс-прапорець (?i)."
  ja: "正規表現を使って、秘匿したいシークレットやデータを追加で定義します。次のコマンドの実行時から適用されます。正規表現の先頭にインラインフラグ (?i) を付けると大文字と小文字を区別しなくなります。"
  zh-Hans: "使用正则表达式定义要隐藏的其他密钥或数据。将在下一条命令运行时生效。你可以在正则表达式前加上内联标志 (?i) 以忽略大小写。"

