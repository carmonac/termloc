"Choose how secrets are visually presented in the block list while keeping them searchable. This setting only affects what you see in the block list.":
  es: "Elige cómo se muestran los secretos en la lista de bloques sin dejar de poder buscarlos. Este ajuste solo afecta a lo que ves en la lista de bloques."
  pt: "Escolha como os segredos são exibidos na lista de blocos, mantendo-os pesquisáveis. Esta configuração afeta apenas o que você vê na lista de blocos."
  fr: "Choisissez comment les secrets sont affichés dans la liste des blocs tout en restant consultables par recherche. Ce paramètre n'affecte que ce que vous voyez dans la liste des blocs."
  de: "Legen Sie fest, wie Geheimnisse in der Blockliste angezeigt werden, ohne dass sie unauffindbar werden. Diese Einstellung wirkt sich nur auf die Anzeige in der Blockliste aus."
  it: "Scegli come vengono mostrati i segreti nell'elenco dei blocchi, mantenendoli ricercabili. Questa impostazione influisce solo su ciò che vedi nell'elenco dei blocchi."
  uk: "Виберіть, як секрети відображаються у списку блоків, зберігаючи можливість пошуку. Це налаштування впливає лише на те, що ви бачите у списку блоків."
  ja: "ブロックリストでのシークレットの表示方法を選択します（検索は引き続き可能です）。この設定はブロックリストの表示にのみ影響します。"
  zh-Hans: "选择密钥在块列表中的显示方式，同时仍可搜索。此设置只影响你在块列表中看到的内容。"

