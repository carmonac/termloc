"When enabled, reopening or restoring a window opens the vertical tabs panel even if it was closed when the window was last saved.":
  es: "Si está activado, al reabrir o restaurar una ventana se abre el panel de pestañas verticales aunque estuviera cerrado cuando se guardó la ventana por última vez."
  pt: "Quando ativado, reabrir ou restaurar uma janela abre o painel de abas verticais mesmo que ele estivesse fechado quando a janela foi salva pela última vez."
  fr: "Lorsque cette option est activée, la réouverture ou la restauration d'une fenêtre ouvre le panneau des onglets verticaux, même s'il était fermé lors du dernier enregistrement de la fenêtre."
  de: "Wenn aktiviert, wird beim erneuten Öffnen oder Wiederherstellen eines Fensters der Bereich für vertikale Tabs geöffnet, auch wenn er beim letzten Speichern des Fensters geschlossen war."
  it: "Se attivata, la riapertura o il ripristino di una finestra apre il pannello delle schede verticali anche se era chiuso all'ultimo salvataggio della finestra."
  uk: "Якщо ввімкнено, під час повторного відкриття або відновлення вікна панель вертикальних вкладок відкривається, навіть якщо її було закрито під час останнього збереження вікна."
  ja: "有効にすると、ウィンドウを再度開くか復元したときに、前回保存時に閉じていても縦タブパネルが開きます。"
  zh-Hans: "启用后，重新打开或恢复窗口时会打开垂直标签页面板，即使上次保存窗口时它处于关闭状态。"

"When using the vertical tab layout, hide the search bar in the title bar. Search stays available via the command palette and keyboard shortcuts.":
  es: "Con las pestañas verticales, oculta la barra de búsqueda de la barra de título. La búsqueda sigue disponible desde la paleta de comandos y los atajos de teclado."
  pt: "Ao usar o layout de abas verticais, oculta a barra de pesquisa na barra de título. A pesquisa continua disponível pela paleta de comandos e pelos atalhos de teclado."
  fr: "Avec les onglets verticaux, masquer la barre de recherche dans la barre de titre. La recherche reste accessible depuis la palette de commandes et les raccourcis clavier."
  de: "Bei vertikalen Tabs die Suchleiste in der Titelleiste ausblenden. Die Suche bleibt über die Befehlspalette und Tastenkürzel verfügbar."
  it: "Con il layout a schede verticali, nasconde la barra di ricerca nella barra del titolo. La ricerca resta disponibile dalla tavolozza dei comandi e con le scorciatoie da tastiera."
  uk: "У разі вертикальних вкладок приховує рядок пошуку на панелі заголовка. Пошук і далі доступний через палітру команд і сполучення клавіш."
  ja: "縦タブレイアウトの使用時に、タイトルバーの検索バーを隠します。検索はコマンドパレットとキーボードショートカットから引き続き使用できます。"
  zh-Hans: "使用垂直标签页布局时，隐藏标题栏中的搜索栏。仍可通过命令面板和键盘快捷键进行搜索。"

